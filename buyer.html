<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Katalog Buku � Jastip</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f7f5f0; --surface:#fff; --border:#e8e4dc;
    --accent:#2d5a27; --accent-light:#e8f5e4;
    --amber:#c97d10; --amber-light:#fef3e0;
    --danger:#c0392b; --danger-light:#fdecea;
    --info:#1a5276; --info-light:#e8f1fa;
    --text:#1a1a1a; --muted:#888070;
    --radius:14px; --sans:'Plus Jakarta Sans',sans-serif; --mono:'DM Mono',monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100dvh; }

  .topbar { background:var(--accent); padding:14px 16px 12px; position:sticky; top:0; z-index:100; }
  .topbar-inner { max-width:600px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; }
  .topbar-logo { color:#fff; font-size:16px; font-weight:800; }
  .topbar-sub  { color:rgba(255,255,255,0.65); font-size:11px; font-family:var(--mono); }
  .my-order-btn { background:rgba(255,255,255,0.15); color:#fff; border:1px solid rgba(255,255,255,0.3); border-radius:20px; padding:6px 14px; font-family:var(--sans); font-size:12px; font-weight:600; cursor:pointer; }

  .main { max-width:600px; margin:0 auto; padding:16px 14px 100px; }
  .banner { background:var(--accent-light); border:1px solid #c3dfc0; border-radius:var(--radius); padding:12px 14px; font-size:12px; color:var(--accent); margin-bottom:16px; font-weight:500; }

  .search-wrap { position:relative; margin-bottom:14px; }
  .search-wrap input { width:100%; padding:12px 16px 12px 40px; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); font-family:var(--sans); font-size:14px; color:var(--text); outline:none; }
  .search-wrap input:focus { border-color:var(--accent); }
  .search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:16px; pointer-events:none; }

  .filter-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px; scrollbar-width:none; }
  .fchip { white-space:nowrap; padding:7px 14px; border-radius:20px; border:1.5px solid var(--border); background:var(--surface); font-size:12px; font-weight:600; color:var(--muted); cursor:pointer; transition:all 0.15s; }
  .fchip.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* UPDATE: Styling untuk Foto Buku */
  .book-item { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; display:flex; gap:12px; align-items:center; cursor:pointer; transition:all 0.15s; }
  .book-item:active { transform:scale(0.99); }
  .book-photo { width:70px; height:70px; background-size:cover; background-position:center; border-radius:10px; flex-shrink:0; background-color:#f0f0f0; border:1px solid var(--border); }
  .book-emoji { font-size:30px; flex-shrink:0; width:70px; height:70px; display:flex; align-items:center; justify-content:center; background:var(--bg); border-radius:10px; }
  
  .book-body  { flex:1; min-width:0; }
  .book-title  { font-size:14px; font-weight:700; line-height:1.3; margin-bottom:2px; }
  .book-author { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .book-footer { display:flex; align-items:center; justify-content:space-between; }
  .book-price  { font-size:16px; font-weight:800; color:var(--accent); }

  .status-badge { font-size:10px; font-weight:600; padding:3px 8px; border-radius:20px; font-family:var(--mono); }
  .badge-available { background:var(--accent-light); color:var(--accent); }
  .badge-reserved  { background:var(--amber-light);  color:var(--amber); }

  /* MODAL */
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:flex-end; z-index:200; backdrop-filter:blur(4px); }
  .modal-bg.show { display:flex; }
  .modal { background:var(--surface); width:100%; max-width:600px; margin:0 auto; border-radius:20px 20px 0 0; padding:24px 20px 40px; animation:slideup 0.25s ease; max-height: 90vh; overflow-y: auto; }
  @keyframes slideup { from { transform:translateY(60px); opacity:0; } to { transform:none; opacity:1; } }
  
  /* PANEL */
  .panel-bg { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:flex-end; z-index:300; backdrop-filter:blur(4px); }
  .panel-bg.show { display:flex; }
  .panel { background:var(--surface); width:100%; max-width:600px; margin:0 auto; border-radius:20px 20px 0 0; padding:24px 20px 40px; animation:slideup 0.25s ease; max-height: 90vh; overflow-y: auto; }
  .panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .panel-title { font-size:18px; font-weight:800; }
  .btn-close-panel { cursor:pointer; font-size:20px; color:var(--muted); font-weight:800; }
  
  .order-card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:10px; }
  .order-card-title { font-size:14px; font-weight:700; margin-bottom:4px; }
  .order-card-meta { font-size:12px; color:var(--muted); margin-bottom:10px; }
  .order-card-footer { display:flex; justify-content:space-between; align-items:center; border-top:1px dashed var(--border); padding-top:10px; }
  .order-total { font-weight:800; font-size:15px; color:var(--accent); }
  .order-st { font-size:10px; font-weight:600; padding:3px 8px; border-radius:20px; font-family:var(--mono); }
  .st-pending { background:#f3f4f6; color:#6b7280; }
  .st-reserved { background:var(--amber-light); color:var(--amber); }
  .st-confirmed { background:var(--accent-light); color:var(--accent); }
  .st-search_tomorrow { background:var(--info-light); color:var(--info); }
  .st-not_found { background:var(--danger-light); color:var(--danger); }
  .grand-total-box { background:var(--accent-light); padding:16px; border-radius:var(--radius); margin-bottom:16px; border:1px solid #c3dfc0; }
  .grand-total-label { font-size:12px; color:var(--accent); font-weight:600; margin-bottom:4px; }
  .grand-total-val { font-size:20px; font-weight:800; color:var(--accent); }
  .panel-note { font-size:11px; color:var(--muted); font-style:italic; margin-top:16px; }
  
  /* UPDATE: Foto di Modal */
  #m-img { width:100%; max-height:250px; object-fit:contain; border-radius:12px; margin-bottom:15px; background:var(--bg); display:none; }

  .price-box { background:var(--bg); border-radius:var(--radius); padding:14px; margin-bottom:16px; }
  .price-row { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
  .price-row.total { font-weight:700; font-size:15px; border-top:1px solid var(--border); padding-top:8px; margin-top:8px; }

  .field { margin-bottom:12px; }
  label { display:block; font-size:11px; font-weight:600; color:var(--muted); margin-bottom:5px; }
  .field input { width:100%; padding:12px 14px; background:var(--bg); border:1.5px solid var(--border); border-radius:10px; font-family:var(--sans); font-size:15px; outline:none; }

  .btn-order  { width:100%; background:var(--accent); color:#fff; font-size:15px; font-weight:700; border:none; border-radius:12px; padding:16px; cursor:pointer; }
  .btn-cancel { width:100%; background:transparent; color:var(--muted); border:none; padding:12px; cursor:pointer; }

  /* LOADING & TOAST */
  #loading { position:fixed; inset:0; background:rgba(247,245,240,0.8); display:none; align-items:center; justify-content:center; z-index:400; flex-direction:column; gap:10px; }
  #loading.show { display:flex; }
  .spinner { width:32px; height:32px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:10px 18px; border-radius:20px; opacity:0; transition:0.25s; z-index:500; font-size:12px; }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><span id="loading-text">Memuat...</span></div>
<div id="toast" class="toast"></div>

<div class="topbar">
  <div class="topbar-inner">
    <div>
      <div class="topbar-logo" id="jastip-name">Jastip Buku</div>
      <div class="topbar-sub" id="event-label">Memuat...</div>
    </div>
    <button class="my-order-btn" onclick="openPanel()">📦 Order saya</button>
  </div>
</div>

<div class="main">
  <div class="banner" id="banner" style="display:none;"></div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="Cari judul atau penulis..." oninput="renderBooks()">
  </div>
  <div class="filter-row">
    <div class="fchip active" onclick="setFilter(this,'')">Semua</div>
    <div class="fchip" onclick="setFilter(this,'available')">✅ Tersedia</div>
    <div class="fchip" onclick="setFilter(this,'reserved')">⏳ Reserved</div>
  </div>
  <div id="book-list"></div>
</div>

<!-- ORDER MODAL -->
<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <img id="m-img" src="" alt="Foto Buku">
    <div class="modal-title" id="m-title" style="font-weight:800; font-size:18px;"></div>
    <div id="m-author" style="color:var(--muted); margin-bottom:15px; font-size:14px;"></div>
    
    <div class="price-box">
      <div class="price-row"><span>Harga buku</span><span id="m-price"></span></div>
      <div class="price-row"><span>Fee jastip</span><span id="m-fee"></span></div>
      <div class="price-row total"><span>Total bayar</span><span id="m-total"></span></div>
    </div>

    <div class="field"><label>NAMA KAMU</label><input type="text" id="m-name" placeholder="Nama lengkap"></div>
    <div class="field"><label>NOMOR WHATSAPP</label><input type="tel" id="m-wa" placeholder="628xxxxxxxx"></div>
    
    <button class="btn-order" onclick="submitOrder()">Kirim Request Order 🚀</button>
    <button class="btn-cancel" onclick="closeModal()">Batal</button>
  </div>
</div>

<!-- MY ORDERS PANEL -->
<div class="panel-bg" id="panel-bg" onclick="closePanel(event)">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">📋 Order Saya</div>
      <div class="btn-close-panel" onclick="closePanel()">✕</div>
    </div>
    <div class="panel-body">
      <div class="field">
        <label>NOMOR WA KAMU</label>
        <div style="display:flex;gap:8px;">
          <input type="tel" id="panel-wa" placeholder="628xxxx" style="flex:1;">
          <button class="btn-order" style="width:auto;padding:0 16px;" onclick="loadMyOrders()">Cek</button>
        </div>
      </div>
      <div id="my-orders-list"></div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/buyer.js"></script>
</body>
</html>
