<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LetterN Books · Jastip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d1a6b;
    --navy-dark: #081044;
    --green: #2db84b;
    --green-light: #e6f9eb;
    --yellow: #f9d82d;
    --pink: #f08fb4;
    --white: #ffffff;
    --muted: rgba(255,255,255,0.6);
    --sans: 'Nunito', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--navy);
    color: var(--white);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    gap: 0;
    background-image: radial-gradient(ellipse at 20% 20%, rgba(45,184,75,0.12) 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 80%, rgba(240,143,180,0.1) 0%, transparent 50%);
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 40px;
  }
  .brand-logo {
    width: 90px;
    height: 90px;
    background: var(--white);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 6px rgba(255,255,255,0.1), 0 12px 40px rgba(0,0,0,0.4);
    overflow: hidden;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .brand-logo img { width: 72px; height: 72px; object-fit: contain; }

  .brand-name {
    text-align: center;
  }
  .brand-name .letter { font-size: 32px; font-weight: 900; color: var(--green); letter-spacing: -0.5px; }
  .brand-name .letter span { color: var(--yellow); }
  .brand-name .books { font-size: 32px; font-weight: 900; color: var(--pink); letter-spacing: -0.5px; }
  .brand-sub { color: var(--muted); font-size: 13px; font-family: var(--mono); margin-top: 4px; }

  .links { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; }
  a {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    border-radius: 16px; text-decoration: none;
    font-weight: 700; font-size: 15px;
    transition: all 0.2s;
    border: 2px solid transparent;
  }
  a:hover { transform: translateY(-2px); }
  a .link-icon { font-size: 22px; width: 36px; text-align: center; flex-shrink: 0; }
  a .link-text { flex: 1; }
  a .link-arrow { color: inherit; opacity: 0.5; }

  .btn-buyer {
    background: var(--green);
    color: var(--white);
    box-shadow: 0 4px 20px rgba(45,184,75,0.35);
  }
  .btn-buyer:hover { background: #25a83f; box-shadow: 0 6px 24px rgba(45,184,75,0.5); }

  .btn-admin1 {
    background: rgba(255,255,255,0.06);
    color: var(--yellow);
    border-color: rgba(249,216,45,0.3);
  }
  .btn-admin1:hover { background: rgba(249,216,45,0.1); border-color: var(--yellow); }

  .btn-admin2 {
    background: rgba(255,255,255,0.06);
    color: var(--pink);
    border-color: rgba(240,143,180,0.3);
  }
  .btn-admin2:hover { background: rgba(240,143,180,0.1); border-color: var(--pink); }

  .version { color: rgba(255,255,255,0.2); font-size: 11px; margin-top: 36px; font-family: var(--mono); text-align: center; }

  .dots {
    display: flex; gap: 6px; margin-bottom: 24px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .dot-g { background: var(--green); }
  .dot-y { background: var(--yellow); }
  .dot-p { background: var(--pink); }
</style>
</head>
<body>
  <div class="brand">
    <div class="brand-logo">
      <!-- Inline SVG book logo matching LetterN Books branding -->
      <img src="LNBLogo.svg" alt="LetterN Books Logo">
    </div>
    <div class="brand-name">
      <div><span class="letter">Letter<span>N</span></span> <span class="books">Books</span></div>
      <div class="brand-sub">sistem jastip buku · event</div>
    </div>
  </div>

  <div class="dots">
    <div class="dot dot-g"></div>
    <div class="dot dot-y"></div>
    <div class="dot dot-p"></div>
  </div>

  <div class="links">
    <a href="buyer.html" class="btn-buyer">
      <span class="link-icon">📚</span>
      <span class="link-text">Lihat Katalog &amp; Order</span>
      <span class="link-arrow">→</span>
    </a>
    <a href="admin1.html" class="btn-admin1">
      <span class="link-icon">📸</span>
      <span class="link-text">Admin 1 — Input Buku</span>
      <span class="link-arrow">→</span>
    </a>
    <a href="admin2.html" class="btn-admin2">
      <span class="link-icon">🖥️</span>
      <span class="link-text">Admin 2 — Dashboard</span>
      <span class="link-arrow">→</span>
    </a>
  </div>

  <div class="version">v1.0 · powered by Google Sheets + Apps Script</div>
</body>
</html>
